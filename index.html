<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天记录生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .phone-frame {
            width: 375px;
            height: 667px;
            background: #f5f5f5;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            border: 12px solid #2c2c2c;
            flex-shrink: 0;
        }

        .phone-header {
            background: #ededed;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #d6d6d6;
            position: relative;
        }

        .phone-header .title {
            font-size: 17px;
            font-weight: 600;
            color: #000;
        }

        .chat-area {
            height: calc(100% - 50px);
            overflow-y: auto;
            padding: 20px 15px;
            background: #ededed;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
        }

        .message.received {
            justify-content: flex-start;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 5px;
            margin: 0 10px;
            flex-shrink: 0;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-content {
            max-width: 60%;
        }

        .bubble {
            padding: 9px 12px;
            border-radius: 5px;
            font-size: 16px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .received .bubble {
            background: white;
            color: #000;
        }

        .sent .bubble {
            background: #95ec69;
            color: #000;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            text-align: center;
        }

        .message-image {
            max-width: 200px;
            border-radius: 5px;
            overflow: hidden;
        }

        .message-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .control-panel {
            width: 400px;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-height: 667px;
            overflow-y: auto;
        }

        .control-panel h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group textarea {
            height: 80px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }

        .btn-primary {
            background: #07c160;
            color: white;
        }

        .btn-primary:hover {
            background: #06ad56;
        }

        .btn-danger {
            background: #f56c6c;
            color: white;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .message-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 10px;
        }

        .message-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .delete-btn {
            color: #f56c6c;
            cursor: pointer;
            font-size: 18px;
        }

        .upload-btn {
            padding: 10px 15px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            text-align: center;
        }

        .upload-btn:hover {
            background: #e0e0e0;
        }

        .preview-container {
            margin-top: 10px;
            text-align: center;
        }

        .preview-container img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone-frame">
            <div class="phone-header">
                <span class="title" id="chatTitle">微信聊天</span>
            </div>
            <div class="chat-area" id="chatArea"></div>
        </div>

        <div class="control-panel">
            <h2>聊天记录生成器</h2>
            
            <div class="form-group">
                <label>消息类型</label>
                <select id="messageType" onchange="toggleInputType()">
                    <option value="text">文本消息</option>
                    <option value="image">图片消息</option>
                </select>
            </div>

            <div class="form-group">
                <label>发送者</label>
                <select id="senderSelect">
                    <option value="me">我（右侧）</option>
                    <option value="other">对方（左侧）</option>
                </select>
            </div>

            <div class="form-group" id="textInputDiv">
                <label>消息内容</label>
                <textarea id="messageInput" placeholder="输入消息内容..."></textarea>
            </div>

            <div class="form-group" id="imageInputDiv" style="display:none;">
                <label>选择图片</label>
                <input type="file" id="imageFile" accept="image/*" onchange="previewImage()" style="display:none;">
                <button class="upload-btn" onclick="document.getElementById('imageFile').click()">
                    📁 点击选择图片
                </button>
                <div class="preview-container" id="previewContainer" style="display:none;">
                    <img id="imagePreview" alt="预览">
                    <button class="btn-danger" onclick="clearImage()" style="margin-top:10px; padding:5px 10px; border:none; border-radius:3px; cursor:pointer;">移除图片</button>
                </div>
            </div>

            <div class="form-group">
                <label>时间</label>
                <input type="text" id="timeInput">
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="addMessage()">添加消息</button>
                <button class="btn btn-danger" onclick="clearAll()">清空所有</button>
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" onclick="exportChat()">导出截图</button>
                <button class="btn btn-secondary" onclick="loadTemplate()">加载示例</button>
            </div>

            <div class="message-list" id="messageList">
                <h3>消息列表</h3>
            </div>
        </div>
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        let messages = [];
        let messageId = 0;
        let currentImageData = null;

        // 初始化
        function getCurrentTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        document.getElementById('timeInput').value = getCurrentTime();

        // 切换输入类型
        function toggleInputType() {
            const type = document.getElementById('messageType').value;
            document.getElementById('textInputDiv').style.display = type === 'text' ? 'block' : 'none';
            document.getElementById('imageInputDiv').style.display = type === 'image' ? 'block' : 'none';
        }

        // 预览图片
        function previewImage() {
            const file = document.getElementById('imageFile').files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageData = e.target.result;
                document.getElementById('imagePreview').src = currentImageData;
                document.getElementById('previewContainer').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        // 清除图片
        function clearImage() {
            currentImageData = null;
            document.getElementById('imageFile').value = '';
            document.getElementById('previewContainer').style.display = 'none';
        }

        // 添加消息
        function addMessage() {
            const type = document.getElementById('messageType').value;
            const sender = document.getElementById('senderSelect').value;
            const time = document.getElementById('timeInput').value || getCurrentTime();
            
            let content = '';
            let imageData = null;

            if (type === 'text') {
                content = document.getElementById('messageInput').value.trim();
                if (!content) {
                    alert('请输入消息内容');
                    return;
                }
            } else if (type === 'image') {
                if (!currentImageData) {
                    alert('请先选择图片');
                    return;
                }
                content = '[图片]';
                imageData = currentImageData;
            }

            const message = {
                id: messageId++,
                sender: sender,
                avatar: sender === 'me' ? '😊' : '👤',
                name: sender === 'me' ? '我' : '对方',
                content: content,
                time: time,
                type: type,
                imageData: imageData
            };

            messages.push(message);
            renderChat();
            renderMessageList();

            // 清空输入
            if (type === 'text') {
                document.getElementById('messageInput').value = '';
            } else {
                clearImage();
            }
            document.getElementById('timeInput').value = getCurrentTime();
        }

        // 渲染聊天
        function renderChat() {
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = '';

            messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.sender === 'me' ? 'sent' : 'received'}`;

                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'avatar';
                avatarDiv.textContent = msg.avatar;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';

                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                if (msg.type === 'image' && msg.imageData) {
                    bubble.innerHTML = `<div class="message-image"><img src="${msg.imageData}" alt="图片"></div>`;
                } else {
                    bubble.textContent = msg.content;
                }

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = `${msg.name} ${msg.time}`;

                contentDiv.appendChild(bubble);
                contentDiv.appendChild(timeDiv);

                if (msg.sender === 'me') {
                    msgDiv.appendChild(contentDiv);
                    msgDiv.appendChild(avatarDiv);
                } else {
                    msgDiv.appendChild(avatarDiv);
                    msgDiv.appendChild(contentDiv);
                }

                chatArea.appendChild(msgDiv);
            });

            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 渲染消息列表
        function renderMessageList() {
            const list = document.getElementById('messageList');
            const html = messages.map(msg => `
                <div class="message-item">
                    <span>${msg.name}: ${msg.type === 'image' ? '📷 图片' : msg.content}</span>
                    <span class="delete-btn" onclick="deleteMessage(${msg.id})">×</span>
                </div>
            `).join('');
            list.innerHTML = '<h3>消息列表</h3>' + html;
        }

        // 删除消息
        function deleteMessage(id) {
            messages = messages.filter(m => m.id !== id);
            renderChat();
            renderMessageList();
        }

        // 清空
        function clearAll() {
            if (confirm('确定清空所有消息？')) {
                messages = [];
                renderChat();
                renderMessageList();
            }
        }

        // 导出截图
        function exportChat() {
            html2canvas(document.querySelector('.phone-frame'), {
                backgroundColor: '#ffffff',
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '聊天记录.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 加载示例
        function loadTemplate() {
            messages = [
                { id: messageId++, sender: 'other', avatar: '👤', name: '张三', content: '在吗？', time: '09:30', type: 'text', imageData: null },
                { id: messageId++, sender: 'me', avatar: '😊', name: '我', content: '在的', time: '09:31', type: 'text', imageData: null }
            ];
            renderChat();
            renderMessageList();
        }

        // 初始渲染
        renderChat();
        renderMessageList();
    </script>
</body>
</html>
