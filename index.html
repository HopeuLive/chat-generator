<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天记录生成器 Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            max-width: 1200px;
        }

        /* 手机模拟器 */
        .phone-frame {
            width: 375px;
            height: 667px;
            background: #f5f5f5;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            border: 12px solid #2c2c2c;
            flex-shrink: 0;
        }

        .phone-header {
            background: #ededed;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #d6d6d6;
            position: relative;
        }

        .phone-header .title {
            font-size: 17px;
            font-weight: 600;
            color: #000;
        }

        .phone-header .back-btn {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #07c160;
            font-size: 16px;
            cursor: pointer;
        }

        .chat-area {
            height: calc(100% - 50px);
            overflow-y: auto;
            padding: 20px 15px;
            background: #ededed;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received {
            justify-content: flex-start;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 5px;
            margin: 0 10px;
            flex-shrink: 0;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-content {
            max-width: 60%;
            position: relative;
        }

        .bubble {
            padding: 9px 12px;
            border-radius: 5px;
            font-size: 16px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .received .bubble {
            background: white;
            color: #000;
        }

        .sent .bubble {
            background: #95ec69;
            color: #000;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            text-align: center;
        }

        /* 控制面板 */
        .control-panel {
            width: 450px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-height: 667px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }

        .tab {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            position: relative;
        }

        .tab.active {
            color: #07c160;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #07c160;
        }

        .tab-content {
            display: none;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #07c160;
        }

        .form-group textarea {
            height: 80px;
            resize: vertical;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-label input[type="radio"] {
            margin-right: 5px;
        }

        .avatar-upload-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .avatar-upload-btn {
            padding: 10px 15px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .avatar-upload-btn:hover {
            background: #e0e0e0;
        }

        .avatar-preview {
            width: 50px;
            height: 50px;
            border: 2px solid #ddd;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: #f9f9f9;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }

        .btn-primary {
            background: #07c160;
            color: white;
        }

        .btn-primary:hover {
            background: #06ad56;
        }

        .btn-danger {
            background: #f56c6c;
            color: white;
        }

        .btn-danger:hover {
            background: #f04545;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .message-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 10px;
            background: #fafafa;
        }

        .message-list h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }

        .message-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .message-item:last-child {
            border-bottom: none;
        }

        .delete-btn {
            color: #f56c6c;
            cursor: pointer;
            font-size: 18px;
            padding: 0 5px;
        }

        .delete-btn:hover {
            color: #f04545;
        }

        @media (max-width: 850px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            
            .control-panel {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 手机模拟器 -->
        <div class="phone-frame">
            <div class="phone-header">
                <span class="back-btn">←</span>
                <span class="title" id="chatTitle">微信聊天</span>
            </div>
            <div class="chat-area" id="chatArea"></div>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('basic')">基础设置</button>
                <button class="tab" onclick="switchTab('advanced')">高级功能</button>
                <button class="tab" onclick="switchTab('themes')">主题</button>
            </div>

            <!-- 基础设置 -->
            <div class="tab-content active" id="basicTab">
                <h2>🎨 基础设置</h2>
                
                <div class="form-group">
                    <label>聊天标题</label>
                    <input type="text" id="chatTitleInput" value="微信聊天" placeholder="输入聊天标题">
                </div>

                <div class="form-group">
                    <label>发送者</label>
                    <select id="senderSelect">
                        <option value="me">我（右侧）</option>
                        <option value="other">对方（左侧）</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>头像</label>
                    <div class="avatar-upload-group">
                        <div class="avatar-preview" id="avatarPreview">😊</div>
                        <button type="button" class="avatar-upload-btn" onclick="document.getElementById('avatarFileInput').click()">
                            📁 上传图片
                        </button>
                        <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
                    </div>
                    <input type="text" id="avatarInput" placeholder="或输入emoji/图片URL" style="margin-top:10px;">
                </div>

                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="nameInput" placeholder="输入昵称">
                </div>

                <div class="form-group">
                    <label>消息内容</label>
                    <textarea id="messageInput" placeholder="输入消息内容..."></textarea>
                </div>

                <div class="form-group">
                    <label>时间</label>
                    <input type="text" id="timeInput" placeholder="例如：14:30">
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="addMessage()">添加消息</button>
                    <button class="btn btn-danger" onclick="clearAll()">清空</button>
                </div>

                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="exportChat()">导出截图</button>
                    <button class="btn btn-secondary" onclick="loadTemplate()">加载示例</button>
                </div>
            </div>

            <!-- 高级功能 -->
            <div class="tab-content" id="advancedTab">
                <h2>🚀 高级功能</h2>
                
                <div class="form-group">
                    <label>批量导入对话</label>
                    <textarea id="batchInput" placeholder="格式：发送者|内容|时间&#10;例如：&#10;我|你好|09:30&#10;对方|你好|09:31"></textarea>
                    <button class="btn btn-secondary" onclick="batchImport()" style="margin-top:10px;">📥 批量导入</button>
                </div>

                <div class="form-group">
                    <label>自动生成对话</label>
                    <div class="btn-group">
                        <button class="btn btn-secondary" onclick="generateConversation('greeting')">问候对话</button>
                        <button class="btn btn-secondary" onclick="generateConversation('business')">商务对话</button>
                        <button class="btn btn-secondary" onclick="generateConversation('casual')">闲聊对话</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>保存/加载</label>
                    <div class="btn-group">
                        <button class="btn btn-secondary" onclick="saveToLocal()">💾 保存到本地</button>
                        <button class="btn btn-secondary" onclick="loadFromLocal()">📂 从本地加载</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>消息管理</label>
                    <div class="btn-group">
                        <button class="btn btn-secondary" onclick="sortByTime()">按时间排序</button>
                        <button class="btn btn-secondary" onclick="reverseMessages()">反转顺序</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>批量操作</label>
                    <div class="btn-group">
                        <button class="btn btn-secondary" onclick="duplicateLast()">复制最后一条</button>
                        <button class="btn btn-secondary" onclick="deleteLast()">删除最后一条</button>
                    </div>
                </div>

                <div class="message-list" id="messageList">
                    <h3>消息列表</h3>
                </div>
            </div>

            <!-- 主题设置 -->
            <div class="tab-content" id="themesTab">
                <h2>🎨 主题设置</h2>
                
                <div class="form-group">
                    <label>聊天主题</label>
                    <select id="themeSelect" onchange="changeTheme()">
                        <option value="wechat">微信风格</option>
                        <option value="qq">QQ风格</option>
                        <option value="dingtalk">钉钉风格</option>
                        <option value="whatsapp">WhatsApp风格</option>
                        <option value="telegram">Telegram风格</option>
                        <option value="custom">自定义主题</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>背景颜色</label>
                    <input type="color" id="bgColor" value="#ededed" onchange="updateCustomTheme()">
                </div>

                <div class="form-group">
                    <label>我的消息气泡颜色</label>
                    <input type="color" id="myBubbleColor" value="#95ec69" onchange="updateCustomTheme()">
                </div>

                <div class="form-group">
                    <label>对方消息气泡颜色</label>
                    <input type="color" id="otherBubbleColor" value="#ffffff" onchange="updateCustomTheme()">
                </div>

                <div class="form-group">
                    <label>字体大小</label>
                    <input type="range" id="fontSize" min="12" max="20" value="16" onchange="updateFontSize()">
                    <span id="fontSizeValue">16px</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        let messages = [];
        let messageId = 0;
        let uploadedAvatarData = null;

        // 主题配置
        const themes = {
            wechat: { 
                bg: '#ededed', 
                myBubble: '#95ec69', 
                otherBubble: '#ffffff',
                headerBg: '#ededed'
            },
            qq: { 
                bg: '#f5f6fa', 
                myBubble: '#00a6ff', 
                otherBubble: '#ffffff',
                headerBg: '#12b7f5'
            },
            dingtalk: { 
                bg: '#f5f5f5', 
                myBubble: '#1890ff', 
                otherBubble: '#ffffff',
                headerBg: '#1890ff'
            },
            whatsapp: { 
                bg: '#e5ddd5', 
                myBubble: '#dcf8c6', 
                otherBubble: '#ffffff',
                headerBg: '#075e54'
            },
            telegram: { 
                bg: '#0e1621', 
                myBubble: '#2b5278', 
                otherBubble: '#182533',
                headerBg: '#17212b'
            }
        };

        function getCurrentTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        document.getElementById('timeInput').value = getCurrentTime();

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            const tabMap = { basic: 'basicTab', advanced: 'advancedTab', themes: 'themesTab' };
            document.getElementById(tabMap[tabName]).classList.add('active');
            event.target.classList.add('active');
        }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
            if (file.size > 2 * 1024 * 1024) { alert('图片大小不能超过2MB'); return; }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedAvatarData = e.target.result;
                document.getElementById('avatarPreview').innerHTML = `<img src="${uploadedAvatarData}" alt="头像">`;
                document.getElementById('avatarInput').value = '';
            };
            reader.readAsDataURL(file);
        }

        function addMessage() {
            const sender = document.getElementById('senderSelect').value;
            const name = document.getElementById('nameInput').value || (sender === 'me' ? '我' : '对方');
            const content = document.getElementById('messageInput').value.trim();
            const time = document.getElementById('timeInput').value || getCurrentTime();
            
            let avatar;
            if (uploadedAvatarData) {
                avatar = uploadedAvatarData;
            } else {
                avatar = document.getElementById('avatarInput').value || (sender === 'me' ? '😊' : '👤');
            }

            if (!content) { alert('请输入消息内容'); return; }

            messages.push({ id: messageId++, sender, avatar, name, content, time });
            renderChat();
            renderMessageList();
            
            document.getElementById('messageInput').value = '';
            document.getElementById('timeInput').value = getCurrentTime();
            
            const chatArea = document.getElementById('chatArea');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function renderChat() {
            const chatArea = document.getElementById('chatArea');
            document.getElementById('chatTitle').textContent = document.getElementById('chatTitleInput').value || '微信聊天';
            chatArea.innerHTML = '';
            
            messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.sender === 'me' ? 'sent' : 'received'}`;
                
                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'avatar';
                if (msg.avatar.startsWith('http') || msg.avatar.startsWith('data:image')) {
                    avatarDiv.innerHTML = `<img src="${msg.avatar}" alt="avatar">`;
                } else {
                    avatarDiv.textContent = msg.avatar;
                }
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = msg.content;
                
                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = `${msg.name} ${msg.time}`;
                
                contentDiv.appendChild(bubble);
                contentDiv.appendChild(timeDiv);
                
                if (msg.sender === 'me') {
                    msgDiv.appendChild(contentDiv);
                    msgDiv.appendChild(avatarDiv);
                } else {
                    msgDiv.appendChild(avatarDiv);
                    msgDiv.appendChild(contentDiv);
                }
                
                chatArea.appendChild(msgDiv);
            });
        }

        function renderMessageList() {
            const list = document.getElementById('messageList');
            const html = messages.map(msg => `
                <div class="message-item">
                    <span>${msg.name}: ${msg.content.substring(0, 20)}${msg.content.length > 20 ? '...' : ''}</span>
                    <span class="delete-btn" onclick="deleteMessage(${msg.id})">×</span>
                </div>
            `).join('');
            list.innerHTML = `<h3>消息列表 (${messages.length})</h3>` + html;
        }

        function deleteMessage(id) {
            messages = messages.filter(m => m.id !== id);
            renderChat();
            renderMessageList();
        }

        function clearAll() {
            if (confirm('确定清空所有消息？')) {
                messages = [];
                renderChat();
                renderMessageList();
            }
        }

        function exportChat() {
            html2canvas(document.querySelector('.phone-frame'), {
                backgroundColor: '#ffffff', scale: 2, useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '聊天记录.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function loadTemplate() {
            messages = [
                { id: messageId++, sender: 'other', avatar: '👤', name: '张三', content: '在吗？', time: '09:30' },
                { id: messageId++, sender: 'me', avatar: '😊', name: '我', content: '在的，怎么了？', time: '09:31' },
                { id: messageId++, sender: 'other', avatar: '👤', name: '张三', content: '明天有空吗？一起吃饭', time: '09:32' },
                { id: messageId++, sender: 'me', avatar: '😊', name: '我', content: '好的，没问题！', time: '09:33' }
            ];
            renderChat();
            renderMessageList();
        }

        function batchImport() {
            const text = document.getElementById('batchInput').value.trim();
            if (!text) { alert('请输入要导入的对话'); return; }
            
            const lines = text.split('\n');
            lines.forEach(line => {
                const parts = line.split('|');
                if (parts.length >= 2) {
                    const sender = parts[0].trim() === '我' ? 'me' : 'other';
                    const content = parts[1].trim();
                    const time = parts[2] ? parts[2].trim() : getCurrentTime();
                    if (content) {
                        messages.push({
                            id: messageId++,
                            sender,
                            avatar: sender === 'me' ? '😊' : '👤',
                            name: sender === 'me' ? '我' : '对方',
                            content,
                            time
                        });
                    }
                }
            });
            renderChat();
            renderMessageList();
            document.getElementById('batchInput').value = '';
            alert('导入成功！');
        }

        function generateConversation(type) {
            const templates = {
                greeting: [
                    { sender: 'other', content: '早上好！', time: '08:00' },
                    { sender: 'me', content: '早上好！', time: '08:01' },
                    { sender: 'other', content: '今天天气不错', time: '08:02' },
                    { sender: 'me', content: '是啊，适合出去玩', time: '08:03' }
                ],
                business: [
                    { sender: 'other', content: '项目进展如何？', time: '14:00' },
                    { sender: 'me', content: '进展顺利', time: '14:05' },
                    { sender: 'other', content: '好的，辛苦了', time: '14:06' }
                ],
                casual: [
                    { sender: 'me', content: '在干嘛呢？', time: '20:00' },
                    { sender: 'other', content: '在看电影', time: '20:01' },
                    { sender: 'me', content: '什么电影？', time: '20:02' }
                ]
            };
            
            templates[type].forEach(item => {
                messages.push({
                    id: messageId++,
                    sender: item.sender,
                    avatar: item.sender === 'me' ? '😊' : '👤',
                    name: item.sender === 'me' ? '我' : '对方',
                    content: item.content,
                    time: item.time
                });
            });
            renderChat();
            renderMessageList();
        }

        function saveToLocal() {
            localStorage.setItem('chatData', JSON.stringify(messages));
            alert('保存成功！');
        }

        function loadFromLocal() {
            const data = localStorage.getItem('chatData');
            if (data) {
                messages = JSON.parse(data);
                messageId = messages.length > 0 ? Math.max(...messages.map(m => m.id)) + 1 : 0;
                renderChat();
                renderMessageList();
                alert('加载成功！');
            } else {
                alert('没有保存的数据');
            }
        }

        function sortByTime() {
            messages.sort((a, b) => a.time.localeCompare(b.time));
            renderChat();
            renderMessageList();
        }

        function reverseMessages() {
            messages.reverse();
            renderChat();
            renderMessageList();
        }

        function duplicateLast() {
            if (messages.length > 0) {
                const last = messages[messages.length - 1];
                messages.push({ ...last, id: messageId++ });
                renderChat();
                renderMessageList();
            }
        }

        function deleteLast() {
            if (messages.length > 0) {
                messages.pop();
                renderChat();
                renderMessageList();
            }
        }

        function changeTheme() {
            const themeName = document.getElementById('themeSelect').value;
            
            if (themeName === 'custom') {
                updateCustomTheme();
                return;
            }
            
            const theme = themes[themeName];
            if (!theme) return;
            
            document.querySelector('.chat-area').style.background = theme.bg;
            document.querySelector('.phone-header').style.background = theme.headerBg;
            document.querySelectorAll('.sent .bubble').forEach(b => b.style.background = theme.myBubble);
            document.querySelectorAll('.received .bubble').forEach(b => b.style.background = theme.otherBubble);
            
            document.getElementById('bgColor').value = theme.bg;
            document.getElementById('myBubbleColor').value = theme.myBubble;
            document.getElementById('otherBubbleColor').value = theme.otherBubble;
        }

        function updateCustomTheme() {
            const bgColor = document.getElementById('bgColor').value;
            const myBubbleColor = document.getElementById('myBubbleColor').value;
            const otherBubbleColor = document.getElementById('otherBubbleColor').value;
            
            document.querySelector('.chat-area').style.background = bgColor;
            document.querySelectorAll('.sent .bubble').forEach(b => b.style.background = myBubbleColor);
            document.querySelectorAll('.received .bubble').forEach(b => b.style.background = otherBubbleColor);
            
            if (document.getElementById('themeSelect').value === 'custom') {
                localStorage.setItem('customTheme', JSON.stringify({
                    bg: bgColor,
                    myBubble: myBubbleColor,
                    otherBubble: otherBubbleColor
                }));
            }
        }

        function updateFontSize() {
            const fontSize = document.getElementById('fontSize').value;
            document.getElementById('fontSizeValue').textContent = fontSize + 'px';
            document.querySelectorAll('.bubble').forEach(b => b.style.fontSize = fontSize + 'px');
        }

        // 加载保存的自定义主题
        function loadCustomTheme() {
            const saved = localStorage.getItem('customTheme');
            if (saved) {
                const theme = JSON.parse(saved);
                document.getElementById('bgColor').value = theme.bg;
                document.getElementById('myBubbleColor').value = theme.myBubble;
                document.getElementById('otherBubbleColor').value = theme.otherBubble;
            }
        }

        document.getElementById('chatTitleInput').addEventListener('input', function() {
            document.getElementById('chatTitle').textContent = this.value || '微信聊天';
        });

        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addMessage();
            }
        });

        // 初始化
        renderChat();
        renderMessageList();
        loadCustomTheme();
    </script>
</body>
</html>
